syntax = "proto3";

package pkl.users.v1;

option go_package = "pkl/backend/gen/pkl/users/v1;usersv1";

message LoginRequest {
    string username = 1;
    string password = 2;
}
message LoginResponse {
    string token = 1;
}

message RegisterRequest {
    string nama = 1;
    string username = 2;
    string password = 3;
}

message RegisterResponse {
    string nama = 1;
    string username = 2;
}


service UserService {
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Register(RegisterRequest) returns (RegisterResponse);
}
