syntax = "proto3";

package pkl.users.v1;

option go_package = "pkl/backend/gen/pkl/users/v1;usersv1";

message LoginRequest {
    string username = 1;
    string password = 2;
}
message LoginResponse {
    string token = 1;
}


service UserService {
    rpc Login(LoginRequest) returns (LoginResponse);
    
}
